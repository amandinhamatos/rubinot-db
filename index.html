<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RubinOT · Meu Database</title>
<style>
:root{--bg:#0b0b0d;--pn:#141418;--pn2:#1f1f26;--ln:#34343f;--tx:#e8e6df;--mu:#9aa0b2;--ac:#e0b64a;--ok:#6fcf97;--bad:#eb6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Georgia,'Times New Roman',serif}
h1,h2,h3,button,input,select,textarea,th{font-family:'Trebuchet MS',Verdana,sans-serif}
header{padding:18px 20px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;color:var(--ac);letter-spacing:.5px}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:12px 20px;border-bottom:1px solid var(--ln)}
nav button{background:none;border:1px solid transparent;color:var(--mu);padding:7px 13px;border-radius:6px;cursor:pointer;font-size:14px}
nav button.on{background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:bold}
main{padding:18px 20px 60px;max-width:1300px;margin:0 auto}
button.b{background:linear-gradient(#3b3321,#221d11);color:#f0d98a;border:1px solid #7a6428;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;box-shadow:inset 0 1px 0 #ffffff22,0 2px 0 #000a}button.b:active{transform:translateY(1px)}
button.b:hover{border-color:var(--ac)}button.x{color:var(--bad)}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:5px 7px;font-size:13px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:auto}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:12px;color:var(--mu);padding:6px;border-bottom:1px solid var(--ln)}
td{padding:4px;border-bottom:1px solid var(--pn2)}
.h{cursor:grab;color:var(--mu);width:22px;text-align:center;user-select:none}
.ov{outline:2px dashed var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.sum{background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:12px;color:var(--mu);display:block}
.hint{color:var(--mu);font-size:13px;margin:0 0 12px;max-width:75ch}
.prog{height:6px;background:var(--bg);border-radius:3px;margin:4px 0 10px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px}
@media(max-width:560px){.cards{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}

.slot{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px;text-align:center}
.th{display:inline-flex;align-items:center;justify-content:center;color:var(--mu);width:34px;height:34px;object-fit:contain;background:var(--pn2);border-radius:4px;font-size:8px;overflow:hidden;vertical-align:middle}
.ex{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;margin-top:4px}.ex .th{width:24px;height:24px}
.nm{font-size:11px;color:var(--mu);line-height:1.2}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}
#md .bx{background:var(--pn);border:1px solid var(--ln);border-radius:10px;width:min(560px,94vw);max-height:80vh;overflow:auto;padding:14px}
.it{display:flex;gap:8px;align-items:center;padding:4px;border-radius:6px;cursor:pointer}.it:hover{background:var(--pn2)}

tr.sc td{background:#eb6b6b14}tr.sc td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
tr.stn td{background:#6fcf9710}tr.stn td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.b.on{background:var(--ac);color:#1a1405;border-color:var(--ac)}
.bc{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.bt{background:var(--ok);color:#06210f;border-radius:9px;padding:0 6px;font-size:11px;margin-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.doll{display:grid;grid-template-columns:repeat(3,96px);gap:6px;justify-content:center;margin:8px 0}
.doll .slot{padding:4px;min-height:86px}.doll .th{width:40px;height:40px}.doll .ex .th{width:22px;height:22px}
tr.maj td:first-child{box-shadow:inset 4px 0 0 #d9534f}tr.min td:first-child{box-shadow:inset 4px 0 0 #8e6fd8}
.tp{border-radius:9px;padding:1px 8px;font-size:11px;font-weight:bold;color:#fff}.tj{background:#d9534f}.tm{background:#8e6fd8}
</style></head><body>
<header><h1>RubinOT · Meu Database</h1>
<div class="bar" style="margin:0">
<button class="b" id="ex">Exportar backup</button>
<button class="b" id="im">Importar backup</button>
<button class="b x" id="rs">Resetar tudo</button>
<input type="file" id="fi" accept=".json" hidden></div></header>
<nav id="nav"></nav><main id="m"></main>
<div id="md"><div class="bx" id="mb"></div></div><datalist id="dl"></datalist>
<script src="data/items.js"></script>
<script src="data/charms.js"></script>
<script>
const SL=['Helmet','Armor','Legs','Boots','Amulet','Ring','Weapon','Shield/Livro','Backpack','Utility','Trinket'];
const ST=['Tenho','Comprar','Vendido'];
const PROG=['Não iniciado','Em andamento','Completo'];
const BASE=[['Yazzy','Elite Knight',209,'Lunarian'],['Pac Mandy','Royal Paladin',135,'Elysian'],['Elekktris','Royal Paladin',121,'Lunarian'],['Klingande','Royal Paladin',347,'Lunarian'],['Toxxic','Elite Knight',122,'Lunarian']];
const ACC=['Conta 1','Conta 1','Conta 1','Conta 2','Conta 2'];
const LISTS={
arsenal:{t:'Arsenal',d:'Equipamentos que você tem e os que precisa comprar. Defina o preço, a moeda (Gold ou RC) e o personagem. O total de “Comprar” é convertido pelo preço da RC do mundo do personagem.',
c:[['n','Item','t'],['s','Slot','s',SL],['c','Personagem','c'],['st','Status','s',ST],['m','Moeda','s',['Gold','RC']],['p','Preço','n'],['o','Obs.','t']]},
hunts:{t:'Hunts',d:'Guia de hunts: qual equipamento, runas, munição e charms usar em cada lugar.',
c:[['n','Hunt','t'],['l','Level mín.','n'],['c','Personagem','c'],['e','Equipamento','t'],['r','Runas / Munição','t'],['ch','Charms','t'],['o','Obs.','t']]},
bestiario:{t:'Bestiário',d:'Criaturas, kills e charm desbloqueado.',
c:[['n','Criatura','t'],['k','Kills','n'],['g','Meta','n'],['ch','Charm','t'],['c','Personagem','c'],['st','Progresso','s',PROG]]},
bosstiary:{t:'Bosstiary',d:'Bosses, kills e nível no Bosstiary.',
c:[['n','Boss','t'],['k','Kills','n'],['g','Meta','n'],['v','Nível','s',['—','Bane','Archfoe','Nemesis']],['c','Personagem','c'],['o','Obs.','t']]},
compras:{t:'Metas e compras',d:'Tarefas e metas de evolução por personagem.',
c:[['d','Feito','k'],['n','Tarefa / Meta','t'],['c','Personagem','c'],['pz','Prazo','t'],['o','Obs.','t']]}
};
const EMPTY={arsenal:[],hunts:[],bestiario:[],bosstiary:[],compras:[]};
const DL=['Harmless','Trivial','Easy','Medium','Hard','Challenging'];
const SEEDCH=['Wound','Enflame','Poison','Freeze','Zap','Curse','Cripple','Parry','Dodge','Adrenaline Burst','Numb','Cleanse','Bless','Scavenge','Gut','Low Blow','Divine Wrath','Vampiric Embrace',"Void's Call",'Savage Blow','Fatal Hold','Overpower','Overflux','Carnage','Void Inversion'];
const JUNK=/Products by|Weapons$|^(Armors|Boots|Helmets|Legs|Rings|Shields|Backpacks|Wands|Rods|Quivers|Spellbooks|Amulets and Necklaces)$/;
const SEED=[['Crown Helmet','Helmet'],['Falcon Circlet','Helmet'],['Gnome Helmet','Helmet'],['Dragon Scale Mail','Armor'],['Falcon Plate','Armor'],['Gnome Armor','Armor'],['Magic Plate Armor','Armor'],['Crown Legs','Legs'],['Falcon Greaves','Legs'],['Gnome Legs','Legs'],['Boots of Haste','Boots'],['Pair of Soft Boots','Boots'],['Prismatic Boots','Boots'],['Prismatic Necklace','Amulet'],['Amulet of Loss','Amulet'],['Stone Skin Amulet','Amulet'],['Prismatic Ring','Ring'],['Ring of Healing','Ring'],['Might Ring','Ring'],['Sword Ring','Ring'],['Falcon Longsword','Weapon'],['Falcon Battleaxe','Weapon'],['Falcon Bow','Weapon'],['Falcon Mace','Weapon'],['Mastermind Shield','Shield/Livro'],['Falcon Shield','Shield/Livro'],['Backpack of Holding','Backpack']].map(a=>({n:a[0],s:a[1],p:'',m:'Gold',img:''}));
function fresh(){return{tab:'chars',chars:BASE.map((b,i)=>({n:b[0],v:b[1],l:b[2],w:b[3],a:ACC[i],meta:'',hunt:'',gear:{},wheel:'',prof:'',charms:'',notes:''})),lists:JSON.parse(JSON.stringify(EMPTY)),rc:{Lunarian:0,Elysian:0},hist:[]}}
function mig(x){x.items=x.items||JSON.parse(JSON.stringify(SEED));x.items=x.items.filter(t=>t.f||t.img||t.p||!JUNK.test(t.n));if(window.CATALOG){const m=new Map(x.items.map(t=>[t.n.toLowerCase(),t]));CATALOG.forEach(c=>{if(JUNK.test(c.n)&&!c.f)return;const t=m.get(c.n.toLowerCase());if(t){t.f=t.f||c.f;t.lvl=c.l;t.arm=c.a;t.ak=c.ak;t.df=c.df;t.im=c.im;t.at=c.at;t.rs=c.rs;t.vo=c.vo}else x.items.push({n:c.n,s:c.s,p:'',m:'Gold',img:'',f:c.f,lvl:c.l,arm:c.a,ak:c.ak,df:c.df,im:c.im,at:c.at,rs:c.rs,vo:c.vo})})}x.sv=x.sv||{items:[{id:'lp',n:'Loot Pouch',rc:390}],own:{}};x.f=x.f||{w:'',c:''};
x.cdef=x.cdef||SEEDCH.map(n=>({n,c:['','',''],t:''}));
if(window.CHARMS)CHARMS.forEach(m=>{let h=x.cdef.find(q=>q.n.toLowerCase()===m.n.toLowerCase());if(!h){h={n:m.n,c:['','',''],t:''};x.cdef.push(h)}if(!h.t)h.t=m.t||'';h.f=m.f||h.f;m.c.forEach((v,i)=>{if(h.c[i]===''||h.c[i]==null)h.c[i]=v})});
x.diff=x.diff||{};DL.forEach(d=>{x.diff[d]=x.diff[d]||{k:['','',''],p:''};const b=window.BEST&&BEST.diff&&BEST.diff[d];if(b){(b.k||[]).forEach((v,i)=>{if(x.diff[d].k[i]==='')x.diff[d].k[i]=v});if(x.diff[d].p==='')x.diff[d].p=b.p}});
x.cc=x.cc||0;
x.diffv=x.diffv||{};DL.forEach(d=>{x.diffv[d]=x.diffv[d]||{k:['','',''],p:''};const b=window.BEST&&BEST.diffv&&BEST.diffv[d];if(b){(b.k||[]).forEach((v,i)=>{if(x.diffv[d].k[i]==='')x.diffv[d].k[i]=v});if(x.diffv[d].p==='')x.diffv[d].p=b.p}});
(x.lists.arsenal||[]).forEach(r=>{r.st=r.st||'Tenho';r.m=r.m||'Gold';if(r.sell===undefined){const g=k=>{const m=String(r.o||'').match(new RegExp(k+' offer:\\s*([\\d.,]+\\s*(?:kk|k)?)','i'));return m?pnum(m[1]):''};r.buy=g('buy');r.sell=g('sell');r.p=r.p===''||r.p==null?'':pnum(r.p)}});x.chars.forEach(c=>{c.gear=c.gear||{};for(const s in c.eq||{})if(c.eq[s]&&!c.gear[s])c.gear[s]=[c.eq[s]]});return x}
let S;try{S=JSON.parse(localStorage.getItem('rubin_db'))}catch(e){}
S=mig(S&&S.chars?S:fresh());
function save(){try{localStorage.setItem('rubin_db',JSON.stringify(S))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const world=n=>(S.chars.find(c=>c.n===n)||{}).w||'Lunarian';
function charOpts(v){return '<option value="">—</option>'+S.chars.map(c=>`<option ${c.n===v?'selected':''}>${esc(c.n)}</option>`).join('')}
function img(n,c=''){if(!n)return'';const it=S.items.find(t=>t.n.toLowerCase()===String(n).toLowerCase());const u=it&&(it.img||(it.f?'img/items/'+it.f:''));return u?`<img class="th ${c}" src="${esc(u)}" alt="${esc(n)}" title="${esc(n)}" loading="lazy" onerror="this.style.opacity=.2;this.onerror=null">`:`<span class="th ${c}" title="${esc(n)}">${esc(String(n)[0]||'?')}</span>`}
function cell(k,i,col,row){const[f,,t,o]=col,v=row[f],a=`data-k="${k}" data-i="${i}" data-f="${f}"`;
if(k==='arsenal'&&f==='n')return`<div style="display:flex;gap:5px;align-items:center">${img(v)}<input ${a} list="dl" value="${esc(v)}"></div>`;
if(t==='t')return`<input ${a} value="${esc(v)}">`;
if(t==='n')return`<input ${a} type="number" value="${esc(v)}">`;
if(t==='k')return`<input ${a} type="checkbox" ${v?'checked':''} aria-label="Feito">`;
if(t==='c')return`<select ${a}>${charOpts(v)}</select>`;
return`<select ${a}>${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`}
function shown(r){return(!S.f.c||r.c===S.f.c)&&(!S.f.w||(r.c&&world(r.c)===S.f.w))}
function total(){let g=0,n=0;(S.lists.arsenal||[]).forEach(r=>{if(r.st!=='Comprar'||!shown(r))return;const p=+r.p||0;n++;g+=r.m==='RC'?p*(+S.rc[world(r.c)]||0):p});
return`${n} itens para comprar · Total ≈ <b>${fmt(g)} gold</b>`+(+S.rc.Lunarian?` · ≈ ${fmt(g/S.rc.Lunarian)} RC (Lunarian)`:'')+(+S.rc.Elysian?` · ≈ ${fmt(g/S.rc.Elysian)} RC (Elysian)`:'')}
function fbar(){return`<div class="bar"><div><label>Servidor</label><select data-flt="w"><option value="">Todos</option>${['Lunarian','Elysian'].map(w=>`<option ${S.f.w===w?'selected':''}>${w}</option>`).join('')}</select></div><div><label>Personagem</label><select data-flt="c"><option value="">Todos</option>${S.chars.filter(c=>!S.f.w||c.w===S.f.w).map(c=>`<option ${S.f.c===c.n?'selected':''}>${esc(c.n)}</option>`).join('')}</select></div></div>`}
function chips(k){return`<div class="strip">${S.chars.map(c=>{const r=S.lists[k].filter(x=>x.c===c.n);return`<button class="b" data-chip="${esc(c.n)}">${esc(c.n)} · ${c.w} · ${r.filter(x=>x.d).length}/${r.length}</button>`}).join('')}</div>`}
function listView(k){const L=LISTS[k],rows=S.lists[k];
const h=rows.map((r,i)=>shown(r)?`<tr data-k="${k}" data-i="${i}"><td class="h" draggable="true" title="Arrastar">⠿</td>${L.c.map(c=>`<td>${cell(k,i,c,r)}</td>`).join('')}<td><button class="b x" data-del="${k}:${i}" aria-label="Remover">✕</button></td></tr>`:'').join('');
return`<h2>${L.t}</h2><p class="hint">${L.d} Arraste o ⠿ para reordenar. Use os filtros para ver só um servidor ou personagem.</p>
${fbar()}${k==='compras'?chips(k):''}
<div class="bar"><button class="b" data-add="${k}">+ Adicionar linha</button>${k==='arsenal'?`<span class="sum" id="tot">${total()}</span>`:''}</div>
<div class="wrap"><table><thead><tr><th></th>${L.c.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${h||`<tr><td colspan="${L.c.length+2}" class="hint">Nada aqui. Clique em “Adicionar linha” ou mude o filtro.</td></tr>`}</tbody></table></div>`}
function slotBox(i,c,s){const g=G(c)[s]||[];return`<div class="slot"><label>${s}</label><div data-pick="${i}|${s}|0" style="cursor:pointer;min-height:50px">${g[0]?img(g[0])+`<div class="nm">${esc(g[0])}</div>`:'<div class="nm">+ escolher</div>'}</div><div class="ex">${g.slice(1).map((x,j)=>`<span data-pick="${i}|${s}|${j+1}" style="cursor:pointer">${img(x)}</span>`).join('')}<button class="b" style="padding:0 6px" data-pick="${i}|${s}|${Math.max(g.length,1)}" title="Adicionar item secundário">+</button></div></div>`}
function charsView(){return`<h2>Personagens</h2><p class="hint">Clique num slot para escolher o item. O “+” embaixo de cada slot adiciona itens secundários (amuletos extras, trinkets). Arraste o título para reordenar.</p>
<div class="cards">${S.chars.map((c,i)=>{const p=Math.min(100,c.meta>0?c.l/c.meta*100:0);const f=(x,l,t='text')=>`<div><label>${l}</label><input type="${t}" data-ch="${i}" data-f="${x}" value="${esc(c[x])}"></div>`;
const ar=st=>S.lists.arsenal.filter(r=>r.c===c.n&&r.st===st&&r.n).map(r=>img(r.n)).join('')||'<span class="hint">vazio</span>';
const pg=S.lists.arsenal.filter(r=>r.c===c.n&&r.st==='Comprar').reduce((a,r)=>a+(r.m==='RC'?(+r.p||0)*(+S.rc[c.w]||0):(+r.p||0)),0);
return`<div class="card" data-k="chars" data-i="${i}"><h3 class="h" draggable="true" style="cursor:grab">⠿ ${esc(c.n)} <small style="color:var(--mu);font-weight:normal">${esc(c.a)} · ${c.w}</small></h3>
<div class="g2">${f('n','Nome')}${f('v','Vocação')}${f('l','Level','number')}${f('meta','Level meta','number')}
<div><label>Mundo</label><select data-ch="${i}" data-f="w">${['Lunarian','Elysian'].map(w=>`<option ${w===c.w?'selected':''}>${w}</option>`).join('')}</select></div>${f('a','Conta')}</div>
<div class="prog"><i style="width:${p}%"></i></div>${f('hunt','Hunt atual')}
${setBar(i,c)}
<div class="doll">${DOLL.map(s=>s?slotBox(i,c,s):'<div></div>').join('')}</div>
${skillBox(i,c)}<h4 style="margin:12px 0 2px;font-family:Verdana">Arsenal</h4><label>Tenho</label><div class="strip">${ar('Tenho')}</div><label>Falta comprar · ≈ ${fmt(pg)} gold</label><div class="strip">${ar('Comprar')}</div>
${[['wheel','Wheel of Destiny'],['prof','Proficiência das armas'],['charms','Charms'],['notes','Observações']].map(([x,l])=>`<label style="margin-top:8px">${l}</label><textarea data-ch="${i}" data-f="${x}">${esc(c[x])}</textarea>`).join('')}
<div style="margin-top:8px"><button class="b x" data-delch="${i}">Remover personagem</button></div></div>`}).join('')}</div>
<p><button class="b" id="addch">+ Novo personagem</button></p>`}
function coinsView(){return`<h2>Rubini Coins</h2><p class="hint">Informe quantos gold vale 1 RC em cada mundo. Esses valores são usados nos totais do Arsenal e no conversor.</p>
<div class="g3" style="max-width:640px">${['Lunarian','Elysian'].map(w=>`<div><label>Gold por RC · ${w}</label><input type="number" data-rc="${w}" value="${S.rc[w]||''}"></div>`).join('')}</div>
<h3>Conversor</h3><div class="g3" style="max-width:640px"><div><label>Quantidade de RC</label><input type="number" id="cr" value="1"></div><div><label>= Gold (Lunarian)</label><input id="o1" readonly></div><div><label>= Gold (Elysian)</label><input id="o2" readonly></div></div>
<h3>Histórico de preços</h3><div class="bar"><button class="b" id="addh">+ Registrar preço</button></div>
<div class="wrap"><table style="min-width:480px"><thead><tr><th>Data</th><th>Mundo</th><th>Gold por RC</th><th></th></tr></thead><tbody>
${S.hist.map((h,i)=>`<tr><td><input type="date" data-h="${i}" data-f="d" value="${esc(h.d)}"></td><td><select data-h="${i}" data-f="w">${['Lunarian','Elysian'].map(w=>`<option ${w===h.w?'selected':''}>${w}</option>`).join('')}</select></td><td><input type="number" data-h="${i}" data-f="p" value="${esc(h.p)}"></td><td><button class="b x" data-delh="${i}">✕</button></td></tr>`).join('')}</tbody></table></div>`}
const iok=t=>(!S.iq||t.n.toLowerCase().includes(S.iq.toLowerCase()))&&(!S.is||t.s===S.is);let IN=0;
function itemsView(){IN=0;const rc=S.rc;return`<h2>Itens</h2><p class="hint">Banco de itens usado nos slots e no Arsenal. As imagens vêm da TibiaWiki quando há internet. Se alguma não aparecer, cole uma URL ou envie sua imagem (📁). Itens em RC são convertidos em gold por servidor.</p>

<p class="nm" style="margin:10px 0 4px">Criaturas <b>Very Rare</b> usam outra tabela:</p><div class="wrap"><table style="min-width:520px"><thead><tr><th>Dificuldade (Very Rare)</th><th>Kills est. 1</th><th>Est. 2</th><th>Completo</th><th>Pontos</th></tr></thead><tbody>${DL.map(d=>`<tr><td>${d}</td>${S.diffv[d].k.map((v,i)=>`<td><input type="number" style="width:90px" data-cf="vk|${d}|${i}" value="${esc(v)}"></td>`).join('')}<td><input type="number" style="width:90px" data-cf="vp|${d}|" value="${esc(S.diffv[d].p)}"></td></tr>`).join('')}</tbody></table></div>
<div class="bar" style="margin-top:12px"><input id="bq" placeholder="Buscar criatura…" value="${esc(S.bq||'')}" style="max-width:220px"><select id="bd" style="max-width:200px"><option value="">Todas as dificuldades</option>${DL.map(d=>`<option ${S.bd===d?'selected':''}>${d}</option>`).join('')}</select><label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="bo" ${S.bo?'checked':''}> só incompletas</label><span class="hint" style="margin:0">${rows.length} criaturas (mostrando até 120)</span></div>
<div class="wrap"><table><thead><tr><th></th><th>Criatura</th><th>Classe</th><th>Dific.</th><th>Kills</th><th>Estágio</th></tr></thead><tbody>${rows.slice(0,120).map(b=>`<tr><td>${b.f?`<img class="th" loading="lazy" src="img/creatures/${esc(b.f)}" alt="">`:''}</td><td>${esc(b.n)}</td><td>${esc(b.cl)}${b.o==='Very Rare'?' · ⭐ Very Rare':''}</td><td>${b.d}</td><td><input type="number" style="width:90px" data-cf="bk|${esc(b.n)}|" value="${esc(c.bk[b.n])}"></td><td>${stage(+c.bk[b.n]||0,b.d,b.o)}/3</td></tr>`).join('')}</tbody></table></div>`}
function G(c){if(!c.sets)c.sets=[0,1,2].map(i=>({n:`${i+1}ª opção`,gear:i?{}:(c.gear||{})}));return c.sets[c.si||0].gear}
function missing(c,j){G(c);const own=new Set(S.lists.arsenal.filter(r=>r.c===c.n&&r.st==='Tenho').map(r=>String(r.n).toLowerCase()));return[...new Set(Object.values(c.sets[j].gear).flat().filter(Boolean))].filter(n=>!own.has(n.toLowerCase())).map(n=>S.items.find(x=>x.n.toLowerCase()===n.toLowerCase())||{n,s:'',p:'',m:'Gold'})}
function cost(c,l){return l.reduce((a,t)=>a+(t.m==='RC'?(+t.p||0)*(+S.rc[c.w]||0):(+t.p||0)),0)}
function buy(c){const have=new Set(S.lists.arsenal.filter(r=>r.c===c.n&&r.st==='Comprar').map(r=>String(r.n).toLowerCase()));let k=0;missing(c,c.si||0).forEach(t=>{if(have.has(t.n.toLowerCase()))return;S.lists.arsenal.push({n:t.n,s:t.s,c:c.n,st:'Comprar',m:t.m,p:t.p});k++});alert(k?`${k} itens adicionados ao Arsenal como “Comprar”.`:'Nada novo para adicionar.');render()}
function setBar(i,c){G(c);const a=c.si||0;
return`<h4 style="margin:12px 0 6px;font-family:Verdana">Sets de equipamento</h4>
<div style="display:flex;gap:6px;flex-wrap:wrap">${c.sets.map((st,j)=>{const m=missing(c,j),has=Object.values(st.gear).flat().filter(Boolean).length;return`<div class="slot" data-set="${i}|${j}" style="cursor:pointer;flex:1;min-width:110px;${j===a?'border-color:var(--ac);':''}"><label>${esc(st.n)}${c.use===j?' · ✓ em uso':''}</label><div class="ex">${SL.map(s=>img((st.gear[s]||[])[0])).join('')}</div><div class="nm">${!has?'vazio':m.length?`faltam ${m.length} · ${fmt(cost(c,m))} gold`:'completo'}</div></div>`}).join('')}</div>
<div class="g2" style="margin:8px 0"><input data-setn="${i}" value="${esc(c.sets[a].n)}" aria-label="Nome do set"><button class="b" data-use="${i}">✓ Marcar em uso</button></div>
<div style="margin-bottom:8px"><button class="b" data-buy="${i}">Adicionar faltantes ao Arsenal</button></div>
<label>Editando: ${esc(c.sets[a].n)} (clique num slot para escolher)</label>`}
const closeP=()=>{document.getElementById('md').style.display='none'};
function drawPick(q){const L=S.items.filter(t=>(P.all||t.s===P.s)&&t.n.toLowerCase().includes(q.toLowerCase())).slice(0,80);
document.getElementById('md').style.display='flex';
document.getElementById('mb').innerHTML=`<div class="bar"><input id="pq" placeholder="Buscar item em ${P.all?'todos os slots':P.s}…" value="${esc(q)}" style="max-width:260px"><label><input type="checkbox" id="pa" ${P.all?'checked':''}> todos os slots</label><button class="b" data-pc>Fechar</button><button class="b x" data-pr>Remover do slot</button></div>`+(L.map(t=>`<div class="it" data-pi="${esc(t.n)}">${img(t.n)}<span>${esc(t.n)} <small style="color:var(--mu)">${t.s}${t.lvl?` · Lv ${t.lvl}`:''}${t.p?` · ${fmt(t.p)} ${t.m}`:''}</small></span></div>`).join('')||'<p class="hint">Nenhum item. Cadastre na aba Itens.</p>');
const e=document.getElementById('pq');e.focus();e.setSelectionRange(q.length,q.length)}
function up(i,f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=64;c.getContext('2d').drawImage(im,0,0,64,64);S.items[i].img=c.toDataURL('image/png');render()};im.src=r.result};r.readAsDataURL(f)}
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(t.id==='pq'){drawPick(t.value);return}
if(t.id==='bq'){S.bq=t.value;render();const q=document.getElementById('bq');q.focus();q.setSelectionRange(q.value.length,q.value.length);return}
if(t.id==='iq'){S.iq=t.value;render();const q=document.getElementById('iq');q.focus();q.setSelectionRange(q.value.length,q.value.length);return}
if(d.k&&d.f!==undefined){S.lists[d.k][d.i][d.f]=t.type==='checkbox'?t.checked:t.value;if(d.k==='arsenal'&&document.getElementById('tot'))document.getElementById('tot').innerHTML=arSum()}
else if(d.setn!==undefined){const c=S.chars[d.setn];G(c);c.sets[c.si||0].n=t.value}
else if(d.ch!==undefined)S.chars[d.ch][d.f]=t.value;
else if(d.rc){S.rc[d.rc]=t.value;conv()}
else if(d.h!==undefined)S.hist[d.h][d.f]=t.value;
else if(d.it!==undefined)S.items[d.it][d.f]=t.value;
else if(d.sv!==undefined)S.sv.items[d.sv][d.f]=d.f==='rc'?+t.value:t.value;
else if(d.own)S.sv.own[d.own]=t.checked;
else if(t.id==='cr')conv();
save()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(t.id==='is'){S.is=t.value;render();return}
if(t.id==='bd'){S.bd=t.value;render();return}
if(d.as!==undefined){S.as=t.value;render();return}
if(d.pf){const[i,f]=d.pf.split('|');S.lists.arsenal[i][f]=pnum(t.value);render();return}
if(t.id==='bo'){S.bo=t.checked;render();return}
if(d.cc!==undefined){S.cc=+t.value;render();return}
if(d.cf){setcf(t);render();return}
if(t.id==='pa'){P.all=t.checked;drawPick(document.getElementById('pq').value);return}
if(d.up!==undefined){up(+d.up,t.files[0]);return}
if(d.flt){S.f[d.flt]=t.value;if(d.flt==='w')S.f.c='';render();return}
if(d.setn!==undefined||d.own||d.sv!==undefined||d.it!==undefined){render();return}
if(d.k==='arsenal'&&d.f==='n'){const r=S.lists.arsenal[d.i],it=S.items.find(x=>x.n.toLowerCase()===String(r.n).toLowerCase());if(it){r.n=it.n;r.s=it.s;if(!r.p)r.p=it.p;r.m=it.m}}
if(d.ch!==undefined&&(['w','n','l','meta'].includes(d.f)||String(d.f).startsWith('sk_'))||d.k==='arsenal'||d.k==='compras')render()});
document.addEventListener('click',e=>{const t=e.target,d=t.dataset,p=t.closest('[data-pick]'),pi=t.closest('[data-pi]');
if(p){const[i,s,x]=p.dataset.pick.split('|');P={i:+i,s,x:+x,all:false};drawPick('');return}
if(pi){const g=G(S.chars[P.i]);g[P.s]=g[P.s]||[];while(g[P.s].length<P.x)g[P.s].push('');g[P.s][P.x]=pi.dataset.pi;closeP();render();return}
if(d.pc!==undefined||t.id==='md'){closeP();return}
if(d.pr!==undefined){const g=G(S.chars[P.i])[P.s]||[];g.splice(P.x,1);closeP();render();return}
const bb=t.closest('[data-aw],[data-ac],[data-ak],[data-addar],[data-delar]');
if(bb){const x=bb.dataset;if(x.aw){S.aw=x.aw;S.ac=''}else if(x.ac!==undefined)S.ac=x.ac;else if(x.ak!==undefined)S.ak=x.ak;else if(x.addar!==undefined)S.lists.arsenal.unshift({n:'',s:S.ak||'',c:S.ac==='__none'?'':S.ac,st:'Comprar',m:'Gold',p:'',sell:'',buy:'',o:''});else if(x.delar!==undefined)S.lists.arsenal.splice(+x.delar,1);render();return}
const cfl=t.closest('[data-cfl]');
if(cfl){S.cf=cfl.dataset.cfl;render();return}
const ss=t.closest('[data-set]');
if(ss){const[i,j]=ss.dataset.set.split('|');S.chars[i].si=+j;render();return}
if(d.use!==undefined){const c=S.chars[d.use];c.use=c.si||0;render();return}
if(d.buy!==undefined){buy(S.chars[d.buy]);return}
if(d.tab){S.tab=d.tab;render()}
else if(d.add){S.lists[d.add].push({c:S.f.c||''});render()}
else if(d.del){const[k,i]=d.del.split(':');S.lists[k].splice(i,1);render()}
else if(d.chip){S.f.c=d.chip;S.f.w='';render()}
else if(d.delch!==undefined){if(confirm('Remover este personagem?')){S.chars.splice(d.delch,1);render()}}
else if(t.id==='addch'){S.chars.push({n:'Novo',v:'',l:1,w:'Lunarian',a:'',meta:'',hunt:'',gear:{},wheel:'',prof:'',charms:'',notes:''});render()}
else if(d.addit!==undefined){S.items.unshift({n:'Novo item',s:'Weapon',p:'',m:'Gold',img:''});render()}
else if(d.delit!==undefined){S.items.splice(d.delit,1);render()}
else if(d.addsv!==undefined){S.sv.items.push({id:'i'+Date.now(),n:'Novo item',rc:0});render()}
else if(d.delsv!==undefined){S.sv.items.splice(d.delsv,1);render()}
else if(t.id==='addh'){S.hist.unshift({d:new Date().toISOString().slice(0,10),w:'Lunarian',p:''});render()}
else if(d.delh!==undefined){S.hist.splice(d.delh,1);render()}
else if(t.id==='ex'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='rubinot-backup.json';a.click()}
else if(t.id==='im')document.getElementById('fi').click();
else if(t.id==='rs'){if(confirm('Apagar todos os dados e voltar ao início?')){S=mig(fresh());render()}}});
document.getElementById('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const j=JSON.parse(x);if(!j.chars)throw 0;S=mig(j);render()}catch(_){alert('Arquivo de backup inválido.')}})};
let dr=null;const arr=k=>k==='chars'?S.chars:k==='items'?S.items:k==='cprio'?S.chars[S.cc||0].cp:S.lists[k];
document.addEventListener('dragstart',e=>{const r=e.target.closest('[data-k][data-i]');if(r&&e.target.classList.contains('h'))dr=[r.dataset.k,+r.dataset.i]});
document.addEventListener('dragover',e=>{if(!dr)return;const r=e.target.closest('[data-k][data-i]');if(r&&r.dataset.k===dr[0]){e.preventDefault();document.querySelectorAll('.ov').forEach(x=>x.classList.remove('ov'));r.classList.add('ov')}});
document.addEventListener('drop',e=>{if(!dr)return;const r=e.target.closest('[data-k][data-i]');if(r&&r.dataset.k===dr[0]){e.preventDefault();const a=arr(dr[0]);a.splice(+r.dataset.i,0,a.splice(dr[1],1)[0])}dr=null;render()});
document.addEventListener('dragend',()=>{dr=null;document.querySelectorAll('.ov').forEach(x=>x.classList.remove('ov'))});
render();
</script></body></html>
